# .github/dependabot.yml

version: 2
updates:
  # Python dependencies (assumes requirements.txt is at the root)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # boto3 and botocore must move together: boto3 requires the botocore of
    # its own version, and a bump of one alone fails on install (it happened
    # on the 14/08 deploy) and fails the test that pins them together. One
    # grouped pull request cannot split them.
    groups:
      aws-sdk:
        patterns:
          - "boto3"
          - "botocore"
      # social-auth-app-django requires the social-auth-core of its own
      # major: 7.0.0 alone did not install over core 5.2.0.
      social-auth:
        patterns:
          - "social-auth-app-django"
          - "social-auth-core"
    # PuLP 4 drops the bundled CBC solver and the LpStatus names the
    # optimizer imports, so a major bump needs a port, not a merge.
    ignore:
      - dependency-name: "pulp"
        update-types: ["version-update:semver-major"]
      # Django 6.1 refuses MySQL below 8.4 and the mysql service runs 8.0.
      # Remove this entry once that service is on 8.4 or later.
      - dependency-name: "django"
        versions: [">=6.1"]
    open-pull-requests-limit: 10

  # JavaScript dependencies: the Capacitor shell of the mobile app. Its
  # core, cli and platform packages are meant to share one version.
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    groups:
      capacitor:
        patterns:
          - "@capacitor/*"
