worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name dofusfashionista.gg www.dofusfashionista.gg;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name dofusfashionista.gg www.dofusfashionista.gg;

        ssl_certificate     /etc/nginx/certs/origin.crt;
        ssl_certificate_key /etc/nginx/certs/origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        resolver 127.0.0.11 valid=10s ipv6=off;

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # ads.txt is served by nginx itself, OUTSIDE the maintenance switch:
        # AdSense flipped to "ads.txt not found" after its crawler landed in
        # the 2026-07-20 outage window where every URL returned the 503
        # maintenance page. The exact-match location wins over "location /",
        # so this file stays up during deploys and even with web down.
        location = /ads.txt {
            root /etc/nginx/html;
            default_type text/plain;
        }

        # The character preview is baked into plain files, and a build nobody
        # has looked at yet is about a hundred of them. nginx serves whatever is
        # already on disk; anything still to bake falls through to Django, which
        # writes it into the same volume, so it only ever happens once.
        # root + an explicit try_files path, not alias: alias and try_files
        # together resolve the wrong path. The piece name cannot hold a slash,
        # so it cannot climb out of the cache.
        location ~ ^/character/parts/(?<skin>\d+)/(?<piece>[\w.\-]+)$ {
            root /app/character_cache;
            try_files /parts/$skin/$piece @app;
            expires max;
            add_header Cache-Control "public, immutable";
        }

        location ~ ^/character/mount/(?<bone>\d+)/(?<piece>\d+\.png)$ {
            root /app/character_cache;
            try_files /mounts/$bone/$piece @app;
            expires max;
            add_header Cache-Control "public, immutable";
        }

        location @app {
            set $upstream web:8000;
            proxy_pass http://$upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120;
        }

        location / {
            # Explicit deploy switch: deploy.sh creates /tmp/maintenance.on in this
            # (always-up) nginx container before restarting web and removes it once
            # web is healthy. While the flag exists nginx serves the "updating" page
            # for the WHOLE window — even while web is fully down — so users never
            # hit Cloudflare's origin-down error. (`if`+`return` is a safe nginx use.)
            if (-f /tmp/maintenance.on) {
                return 503;
            }
            set $upstream web:8000;
            proxy_pass http://$upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120;
            # Fallback: if web is unexpectedly down outside a deploy, still show the
            # maintenance page instead of a raw 502 or Cloudflare's error page.
            proxy_intercept_errors on;
            error_page 502 503 504 =503 /maintenance.html;
        }

        location = /maintenance.html {
            root /etc/nginx/html;
            internal;
        }
    }
}
