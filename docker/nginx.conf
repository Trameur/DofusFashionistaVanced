worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name dofusfashionista.gg www.dofusfashionista.gg;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name dofusfashionista.gg www.dofusfashionista.gg;

        ssl_certificate     /etc/nginx/certs/origin.crt;
        ssl_certificate_key /etc/nginx/certs/origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        resolver 127.0.0.11 valid=10s ipv6=off;

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        location / {
            set $upstream web:8000;
            proxy_pass http://$upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120;
            # While `web` is down/restarting (e.g. during a deploy) show the
            # maintenance page instead of a raw 502 or Cloudflare's error page.
            proxy_intercept_errors on;
            error_page 502 503 504 =503 /maintenance.html;
        }

        location = /maintenance.html {
            root /etc/nginx/html;
            internal;
        }
    }
}
