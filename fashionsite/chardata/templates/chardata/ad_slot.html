{% load i18n %}{# A lazy unit ships without its ins: adsbygoogle.push binds to the first unprocessed element, so nothing here reserves a height #}
{% if ads_enabled and ad_slot %}
<div class="fm-ad {{ extra_class }}{% if ad_lazy %} fm-ad-lazy{% endif %}"
     data-label="{% trans 'Advertisement' %}"
     {% if ad_lazy %}data-ad-client="{{ ad_client }}"
     data-ad-slot="{{ ad_slot }}"
     data-ad-format="{{ ad_format|default:'auto' }}"
     data-full-width="{{ ad_full_width|default:'true' }}"{% endif %}>
  {% if not ad_lazy %}
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="{{ ad_client }}"
       data-ad-slot="{{ ad_slot }}"
       data-ad-format="{{ ad_format|default:'auto' }}"
       data-full-width-responsive="{{ ad_full_width|default:'true' }}"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  {% endif %}
</div>
{% endif %}
