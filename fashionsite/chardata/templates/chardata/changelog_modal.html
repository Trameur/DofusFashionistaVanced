{% load i18n %}
<div id="changelog-overlay" onclick="closeChangelog()"></div>
<div id="changelog-modal" role="dialog" aria-label="{% trans "Changelog" %}">

    <span>{% trans "Changelog" %}</span>
    <button class="changelog-close" onclick="closeChangelog()" aria-label="{% trans "Close" %}">&times;</button>
  </div>
  <div id="changelog-body">
  </div>
</div>
