<script>
    (function() {
        var list = document.getElementById('stat-filter-list');
        var template = document.getElementById('stat-filter-template');
        var addButton = document.getElementById('add-stat-filter');
        var form = document.querySelector('.encyclopedia-filter-box');
        var orderList = document.getElementById('stat-order-list');
        var orderTemplate = document.getElementById('stat-order-template');
        var addOrderButton = document.getElementById('add-order-stat');
        var orderRowsJson = document.getElementById('order-rows-json');

        function updateRemoveButtons() {
            var rows = list.querySelectorAll('.encyclopedia-stat-row');
            rows.forEach(function(row) {
                var removeButton = row.querySelector('.remove-stat-filter');
                if (removeButton) {
                    removeButton.disabled = rows.length === 1;
                }
            });
        }

        function bindRemoveButtons(scope) {
            var buttons = scope.querySelectorAll('.remove-stat-filter');
            buttons.forEach(function(button) {
                button.onclick = function() {
                    var rows = list.querySelectorAll('.encyclopedia-stat-row');
                    if (rows.length <= 1) {
                        return;
                    }
                    button.closest('.encyclopedia-stat-row').remove();
                    updateRemoveButtons();
                };
            });
        }

        function sanitizeStatIconUrl(iconUrl) {
            if (!iconUrl || typeof iconUrl !== 'string') {
                return '';
            }

            var trimmed = iconUrl.trim();
            if (!trimmed) {
                return '';
            }

            try {
                var parsed = new URL(trimmed, window.location.origin);
                var isHttp = parsed.protocol === 'http:' || parsed.protocol === 'https:';
                var isStaticPath = parsed.pathname.indexOf('/static/') === 0;
                if (!isHttp || !isStaticPath) {
                    return '';
                }
                return parsed.href;
            } catch (err) {
                return '';
            }
        }

        function syncStatSelectIcon(select) {
            if (!select) {
                return;
            }
            var wrapper = select.closest('.encyclopedia-stat-select');
            if (!wrapper) {
                return;
            }
            var icon = wrapper.querySelector('.encyclopedia-stat-select-icon');
            var selectedOption = select.options[select.selectedIndex];
            var iconUrl = selectedOption ? selectedOption.getAttribute('data-icon-url') : '';
            if (!icon) {
                return;
            }
            var safeIconUrl = sanitizeStatIconUrl(iconUrl);
            icon.src = safeIconUrl;
            icon.classList.toggle('encyclopedia-stat-select-icon-hidden', !safeIconUrl);
        }

        function bindStatSelectIcons(scope) {
            var selects = scope.querySelectorAll('select[name="stat_key"], select[name="order_key"]');
            selects.forEach(function(select) {
                select.onchange = function() {
                    syncStatSelectIcon(select);
                };
                syncStatSelectIcon(select);
            });
        }

        function updateOrderRemoveButtons() {
            var rows = orderList.querySelectorAll('.encyclopedia-order-row');
            rows.forEach(function(row) {
                var removeButton = row.querySelector('.remove-order-stat');
                if (removeButton) {
                    removeButton.disabled = rows.length === 1;
                }
            });
        }

        function bindOrderRemoveButtons(scope) {
            var buttons = scope.querySelectorAll('.remove-order-stat');
            buttons.forEach(function(button) {
                button.onclick = function() {
                    var rows = orderList.querySelectorAll('.encyclopedia-order-row');
                    if (rows.length <= 1) {
                        return;
                    }
                    button.closest('.encyclopedia-order-row').remove();
                    updateOrderRemoveButtons();
                };
            });
        }

        function syncOrderRowsJson() {
            var rows = orderList.querySelectorAll('.encyclopedia-order-row');
            var payload = [];
            rows.forEach(function(row) {
                var keySelect = row.querySelector('select[name="order_key"]');
                var dirSelect = row.querySelector('select[name="order_dir"]');
                payload.push({
                    key: keySelect ? keySelect.value : '',
                    dir: dirSelect ? dirSelect.value : 'desc'
                });
            });
            orderRowsJson.value = JSON.stringify(payload);
        }

        addButton.addEventListener('click', function() {
            var fragment = template.content.cloneNode(true);
            bindRemoveButtons(fragment);
            bindStatSelectIcons(fragment);
            list.appendChild(fragment);
            updateRemoveButtons();
        });

        addOrderButton.addEventListener('click', function() {
            var fragment = orderTemplate.content.cloneNode(true);
            bindOrderRemoveButtons(fragment);
            bindStatSelectIcons(fragment);
            orderList.appendChild(fragment);
            updateOrderRemoveButtons();
            syncOrderRowsJson();
        });

        form.addEventListener('submit', function() {
            syncOrderRowsJson();
        });

        bindRemoveButtons(document);
        bindOrderRemoveButtons(document);
        bindStatSelectIcons(document);
        updateRemoveButtons();
        updateOrderRemoveButtons();
        syncOrderRowsJson();
    })();
    </script>
