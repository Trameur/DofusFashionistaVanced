{% load static_s3 %}
{% load chardata_stat_icons %}
{% stat_icon_path stat_key as resolved_icon %}
<tr class="solution-stat-summary-line">
    <td class="solution-stat-summary-icon-cell {% if is_last %}bottom-left-cell{% endif %}">
        {% if resolved_icon %}
            <img alt="" class="solution-stat-summary-icon" src="{% static resolved_icon %}">
        {% elif icon %}
            <img alt="" class="solution-stat-summary-icon" src="{% static icon %}">
        {% endif %}
    </td>
    {% if base %}
    <td>
        <span class="solution-stat-summary-name">{{stat_name}}</span>
    </td>
    <td name="stat_value_base_{{stat_key}}" class="solution-stat-summary-value-cell">
    </td>
    {% else %}
    <td colspan="2">
        <span class="solution-stat-summary-name">{{stat_name}}</span>
    </td>
    {% endif %}
    <td name="stat_value_{{stat_key}}" class="solution-stat-summary-value-cell {% if is_last %}bottom-right-cell{% endif %}">
    </td>
</tr>
