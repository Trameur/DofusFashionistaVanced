<div class="encyclopedia-pagination">
    {% if items_page.has_previous %}
    <a class="encyclopedia-page-link"
       href="?{{ page_query_prefix }}page={{ items_page.previous_page_number }}">&lt;</a>
    {% endif %}
    {% for page_num in page_links %}
        {% if not page_num %}
            <span class="encyclopedia-page-gap">…</span>
        {% elif page_num == items_page.number %}
            <span class="encyclopedia-page-link
                         encyclopedia-page-link-current">{{ page_num }}</span>
        {% else %}
            <a class="encyclopedia-page-link"
               href="?{{ page_query_prefix }}page={{ page_num }}">{{ page_num }}</a>
        {% endif %}
    {% endfor %}
    {% if items_page.has_next %}
    <a class="encyclopedia-page-link"
       href="?{{ page_query_prefix }}page={{ items_page.next_page_number }}">&gt;</a>
    {% endif %}
</div>
