<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dofus Fashionista</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      background: #1b1b1b; color: #e8e6c8;
      font-family: Arial, Helvetica, sans-serif;
      display: flex; min-height: 100vh; align-items: center; justify-content: center;
      text-align: center; padding: 24px; box-sizing: border-box;
    }
    h1 { font-variant: small-caps; margin: 0 0 12px; }
    a { color: #f0c419; }
    .spinner {
      width: 38px; height: 38px; margin: 18px auto 0;
      border: 4px solid rgba(255,255,255,0.2); border-top-color: #f0c419;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div>
    <h1>Dofus Fashionista</h1>
    <p>Chargement du site&hellip;</p>
    <div class="spinner"></div>
    <p style="margin-top:22px; font-size:13px; opacity:.8">
      Si rien ne s'affiche, vérifie ta connexion internet puis rouvre l'application.<br>
      <a href="https://dofusfashionista.gg">dofusfashionista.gg</a>
    </p>
  </div>
</body>
</html>
