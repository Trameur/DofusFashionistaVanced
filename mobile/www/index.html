<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dofus Fashionista</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      background: #1b1b1b; color: #e8e6c8;
      font-family: Arial, Helvetica, sans-serif;
      display: flex; min-height: 100vh; align-items: center; justify-content: center;
      text-align: center; padding: 24px; box-sizing: border-box;
    }
    h1 { font-variant: small-caps; margin: 0 0 12px; }
    a { color: #f0c419; }
    .spinner {
      width: 38px; height: 38px; margin: 18px auto 0;
      border: 4px solid rgba(255,255,255,0.2); border-top-color: #f0c419;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div>
    <h1>Dofus Fashionista</h1>
    <p id="loading">Loading the site&hellip;</p>
    <div class="spinner"></div>
    <p style="margin-top:22px; font-size:13px; opacity:.8">
      <span id="offline">If nothing shows up, check your internet connection, then reopen the app.</span><br>
      <a href="https://dofusfashionista.gg">dofusfashionista.gg</a>
    </p>
  </div>
  <script>
    (function () {
      var texts = {
        fr: ['Chargement du site…', "Si rien ne s'affiche, vérifie ta connexion internet puis rouvre l'application."],
        es: ['Cargando el sitio…', 'Si no aparece nada, revisa tu conexión a internet y vuelve a abrir la aplicación.'],
        pt: ['Carregando o site…', 'Se nada aparecer, verifique sua conexão com a internet e abra o aplicativo de novo.'],
        de: ['Seite wird geladen…', 'Wenn nichts erscheint, prüfe deine Internetverbindung und öffne die App erneut.']
      };
      var language = ((navigator.languages && navigator.languages[0]) || navigator.language || 'en').slice(0, 2).toLowerCase();
      var text = texts[language];
      if (!text) {
        return;
      }
      document.documentElement.lang = language;
      document.getElementById('loading').textContent = text[0];
      document.getElementById('offline').textContent = text[1];
    })();
  </script>
</body>
</html>
